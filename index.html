

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Faça seu Login</h1>

    <form id="loginForm">

        <input 
            type="text" 
            id="usuario" 
            placeholder="Usuário" 
            required
        >

        <input 
            type="password" 
            id="senha" 
            placeholder="Senha" 
            required
        >

        <button type="submit">Entrar</button>

    </form>

    <script src="js/script.js"></script>

</body>
</html>
